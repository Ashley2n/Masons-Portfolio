<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel thumbnail template (1280x720)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Template: photo fills the frame, dark gradient along the bottom, small purple label, big reel name.
     Tokens match docs/design-system.md: brand-600 #8A2CF6, brand-400 #C09CFD, neutral-950 near black. */
  :root { --brand-600:#8A2CF6; --brand-400:#C09CFD; --ink:#0b0a10; --paper:#f5f5f7; }
  * { box-sizing:border-box; margin:0 }
  body { width:1280px; height:720px; background:var(--ink); overflow:hidden; }
  .thumb { position:relative; width:1280px; height:720px; overflow:hidden; }
  .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--pos,50% 50%); }
  .thumb::after { content:""; position:absolute; inset:0;
    background:linear-gradient(to top, rgb(11 10 16 / .92) 0%, rgb(11 10 16 / .6) 28%, transparent 55%); }
  .copy { position:absolute; left:64px; right:64px; bottom:56px; z-index:1; color:var(--paper); }
  .label { font:700 26px/1 "Space Mono",monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--brand-400); }
  .bar { width:96px; height:6px; background:var(--brand-600); margin:18px 0 20px; border-radius:3px; }
  .title { font:900 118px/1 "Playfair Display",serif; text-transform:uppercase; letter-spacing:.01em; }
</style>
</head>
<body>
<!-- Query string picks the reel: ?img=../feedback-images/image-5.png&pos=50%25%2040%25&title=Dance%20Reel -->
<main class="thumb" id="t">
  <img id="photo" alt="">
  <div class="copy">
    <p class="label">Mason Farrington</p>
    <div class="bar"></div>
    <h1 class="title" id="title"></h1>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('photo').src = q.get('img') || '';
  document.getElementById('t').style.setProperty('--pos', q.get('pos') || '50% 50%');
  document.getElementById('title').textContent = q.get('title') || 'Reel';
</script>
</body>
</html>
